<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マンガフォーム | Manga Form</title>
    <link rel="stylesheet" href="library.css">
</head>
<body>

    <div class="speed-lines">
        <div class="speed-line" style="top: 10%; left: 0; width: 100%; transform: rotate(5deg);"></div>
        <div class="speed-line" style="top: 30%; left: 0; width: 100%; transform: rotate(-3deg);"></div>
        <div class="speed-line" style="top: 50%; left: 0; width: 100%; transform: rotate(7deg);"></div>
        <div class="speed-line" style="top: 70%; left: 0; width: 100%; transform: rotate(-5deg);"></div>
        <div class="speed-line" style="top: 90%; left: 0; width: 100%; transform: rotate(4deg);"></div>
    </div>

    <div class="manga-panel">
        <div class="halftone"></div>

        <div class="speech-bubble">
            <h1 class="manga-title">
                <span class="title-english">Welcome</span>
                <span class="title-japanese">ようこそ</span>
            </h1>
        </div>

        <p class="subtitle">Inspect the code and find the hidden credentials</p>

        <!-- NO FORM SUBMIT (IMPORTANT FIX) -->
        <div class="manga-form">

            <div class="input-group">
                <input type="text" id="username" placeholder="Username" class="manga-input" required>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder="Email" class="manga-input" required>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Password" class="manga-input" required>
            </div>

            <div id="msg" style="color:red; margin-bottom:10px;"></div>

            <button type="button" class="manga-button" onclick="login()">
                <span class="button-text">Login</span>
                <span class="button-japanese">ログイン</span>
            </button>

        </div>

    </div>

    <script src="library.js"></script>
</body>
</html>
